<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login – wrongowear</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        :root {
            --bg-main: #020617;
            --bg-accent: #0f172a;
            --panel: rgba(15, 23, 42, 0.75);
            --border: rgba(148, 163, 184, 0.15);
            --text-main: #e5e7eb;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(800px circle at 20% 10%, rgba(56,189,248,0.15), transparent 40%),
                radial-gradient(600px circle at 80% 30%, rgba(99,102,241,0.15), transparent 45%),
                linear-gradient(180deg, var(--bg-accent), var(--bg-main));
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2.5rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            text-align: center;
            letter-spacing: -0.04em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.65rem 0.75rem;
            margin-bottom: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.5);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #020617;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        .note a {
            color: var(--accent);
            text-decoration: none;
        }

        .note a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>wrongowear</h1>
        <p class="subtitle">Sign in to access the platform</p>

        <form>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" disabled />

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" disabled />

            <button type="button" disabled>
                Login
            </button>
        </form>

        <p class="note">
            Authentication is not yet enabled.<br />
            This interface is for demonstration purposes only.
        </p>
    </div>
</body>
</html>
