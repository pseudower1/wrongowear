<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login · wrongowear</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        :root {
            --bg-main: #020617;
            --bg-accent: #0f172a;
            --panel: rgba(15, 23, 42, 0.9);
            --border: rgba(148, 163, 184, 0.18);
            --text-main: #e5e7eb;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --error: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(800px circle at 15% 10%, rgba(56,189,248,0.15), transparent 40%),
                radial-gradient(600px circle at 85% 30%, rgba(99,102,241,0.15), transparent 45%),
                linear-gradient(180deg, var(--bg-accent), var(--bg-main));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2.5rem;
            pointer-events: auto;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.8rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.7rem 0.8rem;
            margin-bottom: 1.25rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: #020617;
            color: var(--text-main);
            font-size: 0.9rem;
            pointer-events: auto;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: #020617;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            pointer-events: auto;
        }

        .error {
            display: none;
            margin-top: 1rem;
            text-align: center;
            color: var(--error);
            font-size: 0.85rem;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Sign in</h1>
        <div class="subtitle">Access the wrongowear platform</div>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="off" required />

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="off" required />

            <button type="submit">Login</button>
        </form>

        <div id="errorMessage" class="error">
            Incorrect credentials
        </div>

        <div class="footer">
            <a href="/">← Back to home</a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            document.getElementById("errorMessage").style.display = "block";
        });
    </script>
</body>
</html>
